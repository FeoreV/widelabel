name: wide-label

services:
  # ─── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: wide-label-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wide_label
      POSTGRES_USER: wide_label
      POSTGRES_PASSWORD: wide_label
    ports:
      - "5432:5432"
    volumes:
      - wide_label_pg:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wide_label -d wide_label"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: wide-label-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - wide_label_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: wide-label-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-wide_label_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-wide_label_minio_secret_key_123}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - wide_label_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    container_name: wide-label-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >
      -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-wide_label_minio_admin} $${MINIO_ROOT_PASSWORD:-wide_label_minio_secret_key_123} &&
      mc mb --ignore-existing local/wide-label-media &&
      mc anonymous set download local/wide-label-media
      "

  # ─── Application ───────────────────────────────────────────────────────────

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    container_name: wide-label-backend
    restart: unless-stopped
    env_file:
      - ../.env.docker
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "false"
      DATABASE_URL: postgres://wide_label:wide_label@postgres:5432/wide_label
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-http://localhost:9000}
      STORE_CORS: ${STORE_CORS:-http://localhost:3000}
      ADMIN_CORS: ${ADMIN_CORS:-http://localhost:7001,http://localhost:9000}
      AUTH_CORS: ${AUTH_CORS:-http://localhost:7001,http://localhost:9000,http://localhost:3000}
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 20

  storefront:
    build:
      context: ..
      dockerfile: apps/storefront/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:9000}
        NEXT_PUBLIC_CDEK_WIDGET_URL: ${NEXT_PUBLIC_CDEK_WIDGET_URL:-https://widget.cdek.ru}
        NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-ru}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    container_name: wide-label-storefront
    restart: unless-stopped
    env_file:
      - ../.env.docker
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  wide_label_pg:
  wide_label_redis:
  wide_label_minio:
